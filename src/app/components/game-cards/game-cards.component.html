<div class="cards">
  @for (game of games; track game.name) {
    <mat-card appearance="outlined" class="card">
      <div class="head">
        <img [src]="game.icon" alt="" width="56" height="56" class="icon">
        <div class="title">
          <span class="chip"
                [class.chip-outlined]="game.status === 'Internal testing'"
                [class.chip-tonal]="game.status === 'Closed beta'">{{ game.status }}</span>
          <h3>{{ game.name }}</h3>
        </div>
      </div>
      <p class="desc">{{ game.description }}</p>
      <div class="foot">
        <span class="meta">Android · Google Play</span>
        @if (game.privacyPolicy) {
          <a mat-button [href]="game.privacyPolicy">Privacy policy</a>
        }
      </div>
    </mat-card>
  }
</div>
