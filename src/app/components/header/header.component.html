<header class="header container">
  <a routerLink="/" class="brand">
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
      <rect x="2" y="2" width="11" height="11" rx="3" fill="var(--accent)"/>
      <rect x="15" y="2" width="11" height="11" rx="3" fill="var(--ink)"/>
      <rect x="2" y="15" width="11" height="11" rx="3" fill="var(--ink)"/>
      <rect x="15" y="15" width="11" height="11" rx="3" fill="var(--gold)"/>
    </svg>
    <span>Kapprikorn</span>
  </a>
  <nav aria-label="Main">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
    <a routerLink="/portfolio" routerLinkActive="active">Games</a>
  </nav>
</header>
